<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava - Jaz Ženska</title>
    <link rel="icon" type="image/png" href="images/logo/logo jaz zenska.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .login-container {
            max-width: 500px;
            margin: 100px auto;
            padding: 40px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: var(--dark-violet);
            margin-bottom: 10px;
        }
        .login-header p {
            color: var(--text-light);
            font-size: 16px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 14px;
        }
        .form-group input {
            padding: 12px 16px;
            border: 2px solid var(--almost-white);
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--mid-violet);
        }
        .login-button {
            background: linear-gradient(135deg, var(--mid-violet) 0%, var(--dark-violet) 100%);
            color: var(--white);
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-top: 10px;
        }
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(100, 56, 67, 0.3);
        }
        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }
        .forgot-password a {
            color: var(--mid-violet);
            text-decoration: none;
            font-size: 14px;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Prijava</h1>
            <p>Prijavite se v svoj račun</p>
        </div>
        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
            <div class="error-message" id="errorMessage"></div>
            <div class="form-group">
                <label for="email">Email naslov</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Geslo</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-button" id="loginButton">Prijavi se</button>
        </form>
        <div class="forgot-password">
            <a href="#" onclick="handleForgotPassword(event)">Pozabljeno geslo?</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        // Load Firebase configuration from API
        let firebaseConfig;
        let auth;

        async function initFirebase() {
            try {
                const response = await fetch('/api/firebase-config');
                if (!response.ok) {
                    throw new Error('Failed to load Firebase configuration');
                }
                firebaseConfig = await response.json();
                
                // Initialize Firebase
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
            } catch (error) {
                console.error('Error initializing Firebase:', error);
                alert('Napaka pri inicializaciji Firebase. Prosimo, osvežite stran.');
            }
        }

        // Initialize Firebase when page loads
        initFirebase();
    </script>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            // Wait for Firebase to initialize
            if (!auth) {
                await initFirebase();
            }
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginButton = document.getElementById('loginButton');
            
            // Clear previous errors
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';
            loginButton.disabled = true;
            loginButton.textContent = 'Prijavljanje...';
            
            try {
                // Sign in with Firebase Auth
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Store user info
                localStorage.setItem('userEmail', user.email);
                localStorage.setItem('userId', user.uid);
                localStorage.setItem('userToken', await user.getIdToken());
                
                // Redirect to account page
                window.location.href = 'account.html';
            } catch (error) {
                let errorMessageText = 'Napaka pri prijavi';
                
                // Translate Firebase error codes
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessageText = 'Uporabnik s tem email naslovom ne obstaja.';
                        break;
                    case 'auth/wrong-password':
                        errorMessageText = 'Napačno geslo.';
                        break;
                    case 'auth/invalid-email':
                        errorMessageText = 'Neveljaven email naslov.';
                        break;
                    case 'auth/user-disabled':
                        errorMessageText = 'Ta račun je onemogočen.';
                        break;
                    case 'auth/too-many-requests':
                        errorMessageText = 'Preveč neuspešnih poskusov. Prosimo, poskusite pozneje.';
                        break;
                    default:
                        errorMessageText = error.message || 'Napaka pri prijavi';
                }
                
                errorMessage.textContent = errorMessageText;
                errorMessage.classList.add('show');
                loginButton.disabled = false;
                loginButton.textContent = 'Prijavi se';
            }
        }
        
        async function handleForgotPassword(event) {
            event.preventDefault();
            const email = prompt('Vnesite vaš email naslov:');
            if (!email) return;
            
            try {
                await auth.sendPasswordResetEmail(email);
                alert('Email z navodili za ponastavitev gesla je bil poslan na vaš naslov.');
            } catch (error) {
                let errorMessage = 'Napaka pri pošiljanju emaila';
                
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'Uporabnik s tem email naslovom ne obstaja.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Neveljaven email naslov.';
                }
                
                alert(errorMessage);
            }
        }
    </script>
</body>
</html>
