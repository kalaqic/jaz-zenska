    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava - Jaz Ženska</title>
    <link rel="icon" type="image/png" href="images/logo/logo jaz zenska.webp">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 60px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #faf5f7 0%, #f5eef2 35%, #f0e8ed 70%, #ebe0e8 100%);
        }
        .login-page::before {
            content: '';
            position: absolute;
            top: 50%;
            right: -80px;
            transform: translateY(-50%);
            width: 480px;
            height: 480px;
            background-image: url('images/background-decorations.webp');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.65;
            z-index: 0;
            pointer-events: none;
        }
        .login-page::after {
            content: '';
            position: absolute;
            top: 15%;
            left: -100px;
            width: 380px;
            height: 380px;
            background-image: url('images/background-decorations.webp');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.45;
            z-index: 0;
            pointer-events: none;
        }
        .login-page .login-accent-blur {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }
        .login-page .login-accent-blur-1 {
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, var(--pinky, #c88ea7) 0%, var(--mid-violet, #99627a) 100%);
            top: 10%;
            right: 15%;
        }
        .login-page .login-accent-blur-2 {
            width: 260px;
            height: 260px;
            background: linear-gradient(135deg, var(--mid-violet, #99627a) 0%, var(--dark-violet, #643843) 100%);
            bottom: 20%;
            left: 10%;
        }
        .back-home-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            background: linear-gradient(135deg, var(--mid-violet) 0%, var(--dark-violet) 100%);
            color: var(--white);
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(100, 56, 67, 0.35);
            text-decoration: none;
            display: inline-block;
            z-index: 10;
        }
        .back-home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(100, 56, 67, 0.45);
        }
        .login-container {
            max-width: 460px;
            width: 100%;
            padding: 48px 44px 44px;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
            position: relative;
            z-index: 1;
        }
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--pinky, #c88ea7) 0%, var(--mid-violet, #99627a) 50%, var(--dark-violet, #643843) 100%);
            border-radius: 24px 24px 0 0;
        }
        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }
        .login-header-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--pinky, #c88ea7) 0%, var(--mid-violet, #99627a) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--white);
            box-shadow: 0 8px 24px rgba(153, 98, 122, 0.35);
        }
        .login-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--dark-violet);
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }
        .login-header p {
            color: var(--text-light);
            font-size: 15px;
            margin: 0;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-weight: 600;
            color: var(--dark-violet);
            font-size: 14px;
        }
        .form-group input {
            padding: 14px 18px;
            border: 2px solid #e8e0e4;
            border-radius: 14px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--mid-violet);
            box-shadow: 0 0 0 4px rgba(153, 98, 122, 0.12);
        }
        .form-group input::placeholder {
            color: #aaa;
        }
        .login-button {
            background: linear-gradient(135deg, var(--mid-violet) 0%, var(--dark-violet) 100%);
            color: var(--white);
            padding: 16px 24px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            margin-top: 6px;
            box-shadow: 0 6px 24px rgba(100, 56, 67, 0.3);
        }
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(100, 56, 67, 0.4);
        }
        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }
        .login-no-account {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-light);
        }
        .login-no-account a {
            color: var(--mid-violet);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .login-no-account a:hover {
            color: var(--dark-violet);
            text-decoration: underline;
        }
        .error-message {
            background: linear-gradient(135deg, #fef2f2 0%, #fee 100%);
            color: #b91c1c;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            border: 1px solid #fecaca;
        }
        .error-message.show {
            display: block;
        }
        .forgot-password {
            text-align: center;
            margin-top: 24px;
        }
        .forgot-password a {
            color: var(--mid-violet);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .forgot-password a:hover {
            color: var(--dark-violet);
            text-decoration: underline;
        }
        @media (max-width: 520px) {
            .login-container { padding: 36px 24px 32px; }
            .login-header h1 { font-size: 28px; }
            .login-page::before, .login-page::after { opacity: 0.35; }
        }
    </style>
</head>
<body>
    <a href="/" class="back-home-btn">← Nazaj na domačo stran</a>
    <div class="login-page">
        <div class="login-accent-blur login-accent-blur-1" aria-hidden="true"></div>
        <div class="login-accent-blur login-accent-blur-2" aria-hidden="true"></div>
        <div class="login-container">
            <div class="login-header">
                <div class="login-header-icon" aria-hidden="true">◆</div>
                <h1>Prijava</h1>
                <p>Prijavite se v svoj račun skupnosti JAZ ŽENSKA</p>
            </div>
        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
            <div class="error-message" id="errorMessage"></div>
            <div class="form-group">
                <label for="email">Email naslov</label>
                <input type="email" id="email" name="email" required autocomplete="username" placeholder="vnesite@email.com">
            </div>
            <div class="form-group">
                <label for="password">Geslo</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-button" id="loginButton">Prijavi se</button>
        </form>
        <p class="login-no-account">Še nimaš računa? <a href="/jaz-zenska">Pridruži se nam!</a></p>
        <div class="forgot-password">
            <a href="#" onclick="handleForgotPassword(event)">Pozabljeno geslo?</a>
        </div>
    </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        // Load Firebase configuration from API
        let firebaseConfig;
        let auth;
        let db;

        async function initFirebase() {
            try {
                const response = await fetch('/api/firebase-config');
                if (!response.ok) {
                    throw new Error('Failed to load Firebase configuration');
                }
                firebaseConfig = await response.json();
                
                // Initialize Firebase
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();
            } catch (error) {
                console.error('Error initializing Firebase:', error);
                alert('Napaka pri inicializaciji Firebase. Prosimo, osvežite stran.');
            }
        }

        // Initialize Firebase when page loads
        initFirebase();

        async function handleLogin(event) {
            event.preventDefault();
            
            // Wait for Firebase to initialize
            if (!auth) {
                await initFirebase();
            }
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginButton = document.getElementById('loginButton');
            
            // Clear previous errors
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';
            loginButton.disabled = true;
            loginButton.textContent = 'Prijavljanje...';
            
            try {
                // Sign in with Firebase Auth
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const firebaseUser = userCredential.user;
                
                // Get user data from Firestore
                const userDoc = await db.collection('users').doc(firebaseUser.uid).get();
                
                if (!userDoc.exists) {
                    // If user doesn't exist in Firestore, create basic profile
                    const userData = {
                        email: firebaseUser.email,
                        name: firebaseUser.displayName || firebaseUser.email.split('@')[0],
                        role: 'member', // Default role
                        welcomed: false, // New users need to see welcome flow
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastSignIn: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    
                    await db.collection('users').doc(firebaseUser.uid).set(userData);
                    
                    // Store in localStorage for quick access
                    localStorage.setItem('currentUser', JSON.stringify({
                        userId: firebaseUser.uid,
                        email: userData.email,
                        name: userData.name,
                        role: userData.role,
                        welcomed: false
                    }));
                } else {
                    // Update last sign in
                    await db.collection('users').doc(firebaseUser.uid).update({
                        lastSignIn: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    const userData = userDoc.data();
                    // Store in localStorage for quick access
                    localStorage.setItem('currentUser', JSON.stringify({
                        userId: firebaseUser.uid,
                        email: userData.email,
                        name: userData.name,
                        role: userData.role || 'member',
                        welcomed: userData.welcomed !== undefined ? userData.welcomed : false
                    }));
                }
                
                // Meta Pixel: successful login
                if (typeof fbq !== 'undefined') fbq('track', 'CompleteRegistration', { content_name: 'Moj račun' });
                // Redirect to dashboard
                window.location.href = '/dashboard';
            } catch (error) {
                let errorMessageText = 'Napaka pri prijavi';
                
                // Translate Firebase errors to Slovenian
                if (error.code === 'auth/user-not-found') {
                    errorMessageText = 'Uporabnik s tem email naslovom ne obstaja.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessageText = 'Napačno geslo.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessageText = 'Neveljaven email naslov.';
                } else if (error.code === 'auth/user-disabled') {
                    errorMessageText = 'Ta račun je onemogočen.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessageText = 'Preveč neuspešnih poskusov. Prosimo, poskusite pozneje.';
                } else if (error.message) {
                    errorMessageText = error.message;
                }
                
                errorMessage.textContent = errorMessageText;
                errorMessage.classList.add('show');
                loginButton.disabled = false;
                loginButton.textContent = 'Prijavi se';
            }
        }
        
        async function handleForgotPassword(event) {
            event.preventDefault();
            const email = prompt('Vnesite vaš email naslov:');
            if (!email) return;
            
            try {
                await auth.sendPasswordResetEmail(email);
                alert('Email z navodili za ponastavitev gesla je bil poslan na vaš naslov.\n\nKer imamo nov naslov obstaja možnost da bo naše sporočilo poletelo med nezazeleno pošto torej prosimo da preverite tudi tam. 🌞');
            } catch (error) {
                let errorMessage = 'Napaka pri pošiljanju emaila';
                
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'Uporabnik s tem email naslovom ne obstaja.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Neveljaven email naslov.';
                }
                
                alert(errorMessage);
            }
        }
    </script>
    <script>if(typeof fbq!=='undefined')fbq('track','ViewContent',{content_name:'Prijava'});</script>
</body>
</html>
