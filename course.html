    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tečaj - Jaz Ženska</title>
    <link rel="icon" type="image/png" href="images/logo/logo jaz zenska.webp">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            background: linear-gradient(135deg, #F8F1ED 0%, #f5ebe0 100%);
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
        }
        
        .course-header {
            background: linear-gradient(135deg, var(--mid-violet) 0%, var(--dark-violet) 100%);
            padding: 20px 50px;
            border-radius: 20px;
            margin: 30px auto;
            max-width: 1400px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(100, 56, 67, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .course-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('images/logo/logo_text.webp');
            background-size: 48%;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.15;
            z-index: 0;
        }
        
        .course-header > * {
            position: relative;
            z-index: 1;
        }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: var(--white);
            padding: 10px 25px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            display: inline-block;
            backdrop-filter: blur(10px);
        }
        
        .back-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .course-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 30px;
        }

        .course-loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(248, 241, 237, 0.88);
            backdrop-filter: blur(2px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .course-loading-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .course-loading-spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(100, 56, 67, 0.18);
            border-top-color: var(--dark-violet);
            border-radius: 50%;
            animation: courseSpin 0.9s linear infinite;
        }

        @keyframes courseSpin {
            to { transform: rotate(360deg); }
        }
        
        .course-detail-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            min-height: 600px;
        }
        
        .course-progress {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
            border: 1px solid rgba(100, 56, 67, 0.1);
        }
        
        .progress-label {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--dark-violet);
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: var(--almost-white);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, var(--mid-violet) 0%, var(--dark-violet) 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        .progress-percentage {
            text-align: right;
            margin-top: 8px;
            font-size: 14px;
            color: var(--text-light);
            font-weight: 600;
        }
        
        .course-episodes {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            height: fit-content;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(100, 56, 67, 0.1);
        }
        
        .episodes-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--dark-violet);
            margin-bottom: 25px;
            font-weight: 700;
        }

        .episodes-mobile-toggle-wrap {
            display: none;
        }

        .episodes-mobile-toggle {
            width: 100%;
            border: 1px solid rgba(100, 56, 67, 0.2);
            border-radius: 12px;
            background: #fff;
            color: var(--dark-violet);
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .episodes-mobile-toggle:hover {
            border-color: var(--mid-violet);
            transform: translateY(-1px);
        }
        
        .episode-item {
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .episode-item:hover {
            background: var(--main-white);
            border-color: var(--almost-white);
            transform: translateX(5px);
        }
        
        .episode-item.active {
            background: linear-gradient(135deg, var(--mid-violet) 0%, var(--dark-violet) 100%);
            color: var(--white);
            border-color: var(--dark-violet);
            box-shadow: 0 4px 15px rgba(100, 56, 67, 0.3);
        }
        
        .episode-item.active .episode-title,
        .episode-item.active .episode-number {
            color: var(--white);
        }
        
        .episode-item.watched {
            background: var(--main-white);
            border-color: var(--mid-violet);
        }
        
        .episode-item.watched .episode-title::after {
            content: ' ✓';
            color: var(--mid-violet);
            font-weight: bold;
        }
        
        .episode-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--mid-violet);
            flex-shrink: 0;
        }
        
        .episode-content {
            flex: 1;
        }
        
        .episode-number {
            font-size: 12px;
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 8px;
            color: var(--text-light);
        }
        
        .episode-title {
            font-weight: 600;
            color: var(--dark-violet);
            font-size: 15px;
            line-height: 1.4;
        }
        
        .course-content {
            background: var(--white);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(100, 56, 67, 0.1);
        }
        
        @font-face {
            font-family: 'Priestacy';
            src: url('fonts/Priestacy.otf') format('opentype');
        }
        
        .course-content-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: var(--dark-violet);
            margin-bottom: 30px;
            font-weight: 700;
            line-height: 1.3;
        }
        
        .course-video {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 15px;
            margin-bottom: 30px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .course-description {
            color: var(--text-dark);
            line-height: 1.8;
            font-size: 16px;
            white-space: pre-wrap;
        }

        .episode-nav-bar {
            display: flex;
            gap: 10px;
            margin: 0 0 20px;
        }

        .episode-nav-btn {
            flex: 1;
            border: 1px solid rgba(100, 56, 67, 0.2);
            background: #fff;
            color: var(--dark-violet);
            border-radius: 12px;
            padding: 11px 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .episode-nav-btn:hover:not(:disabled) {
            border-color: var(--mid-violet);
            transform: translateY(-1px);
        }

        .episode-nav-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .episode-exercise,
        .episode-comments {
            margin-top: 18px;
            padding: 18px;
            border: 1px solid rgba(100, 56, 67, 0.12);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.78);
        }

        .episode-exercise h4,
        .episode-comments h4 {
            margin: 0 0 10px;
            font-family: 'Playfair Display', serif;
            color: var(--dark-violet);
            font-size: 22px;
        }

        .episode-exercise p {
            margin: 0 0 10px;
            line-height: 1.7;
            color: var(--text-dark);
            white-space: pre-wrap;
        }

        .exercise-note-label {
            display: block;
            margin: 8px 0 8px;
            color: var(--dark-violet);
            font-weight: 700;
            font-size: 14px;
        }

        .exercise-note-input {
            width: 100%;
            border: 1px solid rgba(100, 56, 67, 0.2);
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            resize: vertical;
            box-sizing: border-box;
            min-height: 120px;
            background: #fff;
        }

        .save-exercise-note-btn {
            margin-top: 10px;
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--mid-violet) 0%, var(--dark-violet) 100%);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .exercise-note-status {
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-light);
            font-weight: 600;
        }

        .exercise-note-status.done {
            color: #2e7d32;
        }

        .episode-comment-input {
            width: 100%;
            border: 1px solid rgba(100, 56, 67, 0.2);
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            resize: vertical;
            box-sizing: border-box;
            min-height: 110px;
        }

        .save-comment-btn {
            margin-top: 10px;
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--mid-violet) 0%, var(--dark-violet) 100%);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .admin-comments-list {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px dashed rgba(100, 56, 67, 0.25);
        }

        .admin-comments-list h5 {
            margin: 0 0 10px;
            color: var(--dark-violet);
            font-size: 14px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .admin-comment-item {
            padding: 10px 12px;
            border: 1px solid rgba(100, 56, 67, 0.1);
            border-radius: 10px;
            background: #fff;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-dark);
            line-height: 1.6;
        }

        .admin-comment-meta {
            font-weight: 700;
            color: var(--dark-violet);
            margin-bottom: 4px;
            font-size: 12px;
        }
        
        .episode-actions {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid var(--almost-white);
        }
        
        .next-episode-btn,
        .finish-course-btn {
            background: linear-gradient(135deg, var(--mid-violet) 0%, var(--dark-violet) 100%);
            color: var(--white);
            padding: 15px 35px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(100, 56, 67, 0.3);
            width: 100%;
        }
        
        .next-episode-btn:hover,
        .finish-course-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(100, 56, 67, 0.4);
        }
        
        .finish-course-btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: var(--dark-violet);
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }
        
        .finish-course-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }
        
        .congratulations-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .congratulations-content {
            background: var(--white);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            animation: slideUp 0.4s ease;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .congratulations-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        .congratulations-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: var(--dark-violet);
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .congratulations-message {
            font-size: 18px;
            color: var(--text-dark);
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .congratulations-btn {
            background: linear-gradient(135deg, var(--mid-violet) 0%, var(--dark-violet) 100%);
            color: var(--white);
            padding: 12px 40px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(100, 56, 67, 0.3);
            text-decoration: none;
            display: inline-block;
        }
        
        .congratulations-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(100, 56, 67, 0.4);
        }
        
        @media (max-width: 768px) {
            .course-detail-container {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            .course-left-column {
                order: 2;
            }

            .course-episodes {
                max-height: none;
            }

            .episodes-mobile-toggle-wrap {
                display: block;
                margin-bottom: 12px;
            }

            .course-episodes.mobile-collapsed #episodesList {
                display: none;
            }
            
            .course-content {
                order: 1;
                padding: 30px;
            }
            
            .course-content-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div id="courseLoadingOverlay" class="course-loading-overlay show" aria-hidden="true">
        <div class="course-loading-spinner" role="status" aria-label="Nalaganje"></div>
    </div>
    <div class="course-container">
        <div class="course-header">
            <a href="/dashboard" class="back-btn">← Nazaj na učilnico</a>
            <div id="courseHeaderTitle" style="font-family: 'Priestacy', cursive; font-size: 28px; color: var(--white); font-weight: normal; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);">Nalaganje...</div>
        </div>
        
        <div class="course-detail-container">
            <div class="course-left-column">
                <div class="course-progress">
                    <div class="progress-label">Napredek tečaja</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
                    </div>
                    <div class="progress-percentage" id="progressPercentage">0%</div>
                </div>
                
                <div class="course-episodes">
                    <div class="episodes-title">Vse epizode</div>
                    <div class="episodes-mobile-toggle-wrap">
                        <button type="button" id="episodesToggleBtn" class="episodes-mobile-toggle" onclick="toggleEpisodesPanel()" aria-expanded="false">Izberi epizodo</button>
                    </div>
                    <div id="episodesList">
                        <!-- Episodes will be loaded here -->
                    </div>
                </div>
            </div>
            
            <div class="course-content">
                <div id="courseContentArea">
                    <!-- Course content will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        // Load Firebase configuration from API
        let firebaseConfig;
        let auth;
        let db;

        async function initFirebase() {
            try {
                const response = await fetch('/api/firebase-config');
                if (!response.ok) {
                    throw new Error('Failed to load Firebase configuration');
                }
                firebaseConfig = await response.json();
                
                // Initialize Firebase
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();
                
                // Check auth state
                auth.onAuthStateChanged(async (user) => {
                    if (!user) {
                        window.location.href = '/login';
                    }
                });
            } catch (error) {
                console.error('Error initializing Firebase:', error);
                window.location.href = '/login';
            }
        }

        // Initialize Firebase when page loads
        initFirebase();
        
        // Helper function to get current user
        function getCurrentUser() {
            const userStr = localStorage.getItem('currentUser');
            if (!userStr) {
                window.location.href = '/login';
                return null;
            }
            return JSON.parse(userStr);
        }
    </script>
    <script src="https://player.vimeo.com/api/player.js"></script>
    <script src="js/course.js"></script>
    <script>if(typeof fbq!=='undefined')fbq('track','ViewContent',{content_name:'Tečaj'});</script>
</body>
</html>
